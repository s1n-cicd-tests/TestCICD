name: reviewdog
on: [workflow_call]
jobs:
  octoscan:
    name: octoscan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: hugo-syn/octoscan-action@master
        with:
          filter_mode: file
          reporter: github-pr-annotations
